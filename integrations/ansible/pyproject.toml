[project]
name = "sekret-ansible"
version = "0.1.0"
description = "Ansible collection for the sekret secrets manager"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ansible-core",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections.sekret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running sekret server (SEKRET_TEST_URL and SEKRET_TEST_TOKEN)",
]
