name: sekret-system-test

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm", "--http-port=18081", "--hostname=http://localhost:18081", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    network_mode: host

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sekret
      POSTGRES_PASSWORD: sekret
      POSTGRES_DB: sekret
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekret"]
      interval: 2s
      timeout: 2s
      retries: 30
