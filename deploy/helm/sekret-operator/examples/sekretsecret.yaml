# The operator logs in to sekret as this service account. Configure the sekret
# identity's Kubernetes auth to allow namespace "web" and service account "web-secrets".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-secrets
  namespace: web
---
apiVersion: sekret.sam-ruff.github.io/v1alpha1
kind: SekretSecret
metadata:
  name: web-config
  namespace: web
spec:
  project: web
  environment: prod
  path: /
  recursive: false
  # Optional; every key at the path is synced when omitted.
  keys:
    - DATABASE_URL
    - SESSION_KEY
  refreshInterval: 5m
  target:
    name: web-env
    type: Opaque
    labels:
      app.kubernetes.io/part-of: web
  auth:
    identityId: 00000000-0000-0000-0000-000000000000
    serviceAccountName: web-secrets
