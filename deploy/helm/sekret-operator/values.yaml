image:
  # Image containing the sekret binary.
  repository: sekret
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

sekret:
  # Base URL of the sekret server, for example https://sekret.example.com
  serverUrl: ""
  # Allow a plain http:// server that is not on loopback. Service account tokens and secret
  # values then cross the network unencrypted.
  allowInsecureHttp: false
  # Optional ConfigMap holding a PEM CA bundle for the sekret server.
  caBundle:
    configMapName: ""
    key: ca.crt
  # Optional kubernetes.io/tls Secret (tls.crt, tls.key) presented when the server requires mutual TLS.
  clientCertificate:
    secretName: ""
  requestTimeoutSeconds: 30

# Namespaces to watch. Each gets its own Role and RoleBinding. Empty means the release namespace.
watchNamespaces: []

# Watch every namespace with a ClusterRole instead. This lets the operator mint a token for any
# service account in the cluster and read every Secret, which is close to cluster-admin.
clusterWide: false

# When set, the operator may only read and mint tokens for these service accounts, in every
# watched namespace. Empty allows any service account there that has opted in.
tokenServiceAccounts: []

# ValidatingAdmissionPolicies that only let the operator request tokens with the `sekret`
# audience, for at most 600 seconds, outside kube-system, and only write Secrets of the types
# the operator supports, never service account tokens. Writes are also limited to Secrets
# labelled as the operator's and controlled by a SekretSecret, and an update may not change that
# owner, so the operator cannot overwrite other Secrets. This protects integrity only: RBAC
# cannot limit reads by label, so the operator can still read every Secret it can reach.
# Needs Kubernetes 1.30 or later.
tokenPolicy:
  enabled: true

concurrency: 4

logLevel: info

serviceAccount:
  create: true
  # Defaults to the release full name. Required when create is false, and never "default".
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
