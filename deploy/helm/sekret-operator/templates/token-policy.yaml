{{- if .Values.tokenPolicy.enabled }}
{{- $fullname := include "sekret-operator.fullname" . }}
{{- $username := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "sekret-operator.serviceAccountName" .) }}
# Limits the tokens the operator can mint to ones only sekret accepts, whatever its RBAC allows.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-tokens
  labels:
    {{- include "sekret-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  matchConditions:
    - name: requested-by-the-operator
      expression: request.userInfo.username == {{ $username | quote }}
  validations:
    - expression: has(object.spec.audiences) && object.spec.audiences == ["sekret"]
      message: the sekret operator may only request tokens for the sekret audience
    - expression: has(object.spec.expirationSeconds) && object.spec.expirationSeconds <= 600
      message: the sekret operator may only request tokens that expire within 600 seconds
    - expression: request.namespace != "kube-system"
      message: the sekret operator may not request tokens in kube-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-tokens
  labels:
    {{- include "sekret-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-tokens
  validationActions: ["Deny"]
---
# A Secret of type service-account-token would get a non-expiring token from the cluster, so the
# operator may only write the types reconcile.rs ALLOWED_SECRET_TYPES lists. It may also only
# create Secrets marked as its own and change Secrets a SekretSecret already controls, so a bug or
# a stolen token cannot overwrite other Secrets its RBAC reaches. Reads are not limited.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "sekret-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: written-by-the-operator
      expression: request.userInfo.username == {{ $username | quote }}
  variables:
    - name: controller
      expression: >-
        has(object.metadata.ownerReferences) ?
        object.metadata.ownerReferences.filter(r, has(r.controller) && r.controller) : []
    - name: oldController
      expression: >-
        request.operation == "UPDATE" && has(oldObject.metadata.ownerReferences) ?
        oldObject.metadata.ownerReferences.filter(r, has(r.controller) && r.controller) : []
  validations:
    - expression: >-
        has(object.type) && object.type in ["Opaque", "kubernetes.io/basic-auth", "kubernetes.io/dockercfg",
        "kubernetes.io/dockerconfigjson", "kubernetes.io/ssh-auth", "kubernetes.io/tls"]
      message: the sekret operator may only write Secrets that carry data, not service account tokens
    - expression: >-
        !has(object.metadata.annotations) ||
        !object.metadata.annotations.exists(k, k.startsWith("kubernetes.io/service-account."))
      message: the sekret operator may not write service account annotations
    - expression: request.namespace != "kube-system"
      message: the sekret operator may not write Secrets in kube-system
    - expression: >-
        has(object.metadata.labels) && "app.kubernetes.io/managed-by" in object.metadata.labels &&
        object.metadata.labels["app.kubernetes.io/managed-by"] == "sekret-operator" &&
        size(variables.controller) == 1 && variables.controller[0].kind == "SekretSecret" &&
        variables.controller[0].apiVersion.startsWith("sekret.sam-ruff.github.io/")
      message: the sekret operator may only write Secrets it manages for a SekretSecret
    - expression: >-
        request.operation != "UPDATE" ||
        (size(variables.oldController) == 1 && size(variables.controller) == 1 &&
        variables.oldController[0].kind == "SekretSecret" &&
        variables.oldController[0].uid == variables.controller[0].uid)
      message: the sekret operator may only change Secrets its SekretSecret already controls
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "sekret-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-secrets
  validationActions: ["Deny"]
{{- end }}
