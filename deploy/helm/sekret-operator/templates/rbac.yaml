{{- $namespaced := ne .Values.watchNamespace "" }}
{{- $kind := ternary "Role" "ClusterRole" $namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "sekret-operator.fullname" . }}
  {{- if $namespaced }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "sekret-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["sekret.sam-ruff.github.io"]
    resources: ["sekretsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sekret.sam-ruff.github.io"]
    resources: ["sekretsecrets/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ include "sekret-operator.fullname" . }}
  {{- if $namespaced }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "sekret-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "sekret-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sekret-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
