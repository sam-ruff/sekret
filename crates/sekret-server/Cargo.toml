[package]
name = "sekret-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
hex = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1", "http2", "service"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ipnet = "2.12.2"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = "0.2.191"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sekret-api = { version = "0.1.0", path = "../sekret-api" }
sekret-core = { version = "0.1.0", path = "../sekret-core" }
sekret-store = { version = "0.1.0", path = "../sekret-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit", "timeout"] }
tracing = "0.1.44"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v4", "v7"] }
zeroize = "1.9.1"

[features]
testkit = []

[dev-dependencies]
sekret-server = { path = ".", features = ["testkit"] }
mockall = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sekret-store = { path = "../sekret-store", features = ["mock"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = "0.6.5"
url = "2.5.8"
base64 = "0.23.1"
sha2 = "0.11.1"
rcgen = "0.14.10"
anyhow = "1.0.104"
zeroize = "1.9.1"

[lints]
workspace = true
