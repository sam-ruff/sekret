[package]
name = "sekret"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
ipnet = "2.12.2"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sekret-api = { version = "0.1.0", path = "../sekret-api" }
sekret-client = { version = "0.1.0", path = "../sekret-client" }
sekret-core = { version = "0.1.0", path = "../sekret-core" }
sekret-operator = { version = "0.1.0", path = "../sekret-operator" }
sekret-server = { version = "0.1.0", path = "../sekret-server" }
sekret-store = { version = "0.1.0", path = "../sekret-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zeroize = "1.9.1"

[features]
# Tests that need the docker compose stack in deploy/system-test; see scripts/system-test.sh.
system-tests = []

[dev-dependencies]
axum = "0.8.9"
mockall = "0.15.0"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "form", "json"] }
sekret-client = { path = "../sekret-client", features = ["mock"] }
sekret-server = { path = "../sekret-server", features = ["testkit"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "postgres"] }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"

[lints]
workspace = true
