[package]
name = "sekret-operator"
version = "0.1.0"
edition = "2024"

[features]
# Runs tests/system.rs against a k3s container; needs Docker with privileged containers.
system-tests = []

[[test]]
name = "system"
required-features = ["system-tests"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
k8s-openapi = { version = "0.28", features = ["v1_33"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive", "unstable-runtime"] }
schemars = "1.2.3"
sekret-api = { version = "0.1.0", path = "../sekret-api" }
sekret-client = { version = "0.1.0", path = "../sekret-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
http = "1.5.0"
mockall = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sekret-client = { path = "../sekret-client", features = ["mock"] }
sekret-core = { path = "../sekret-core" }
sekret-server = { path = "../sekret-server", features = ["testkit"] }
sekret-store = { path = "../sekret-store" }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["k3s"] }
tokio = { version = "1.54.1", features = ["net", "sync"] }
zeroize = "1.9.1"

[lints]
workspace = true
