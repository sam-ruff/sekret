[package]
name = "sekret-client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
mockall = { version = "0.15.0", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
sekret-api = { version = "0.1.0", path = "../sekret-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "sync", "time", "rt"] }
url = "2.5.8"

[features]
mock = ["dep:mockall"]

[dev-dependencies]
anyhow = "1.0.104"
mockall = "0.15.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sekret-core = { path = "../sekret-core" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
