[project]
site_name = "sekret"
site_url = "https://sam-ruff.github.io/sekret/"
site_description = "A self-hosted secrets manager in one static binary"
site_author = "Sam Ruff"
repo_url = "https://github.com/sam-ruff/sekret"
repo_name = "sam-ruff/sekret"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Sam Ruff. MIT licensed."

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = "configuration.md" },
  { "Deployment" = "deployment.md" },
  { "User guide" = [
    { "Projects and environments" = "user-guide/projects.md" },
    { "Secrets, history and snapshots" = "user-guide/secrets.md" },
    { "Access control" = "user-guide/access-control.md" },
    { "Machine identities" = "user-guide/machine-identities.md" },
    { "Generation and rotation" = "user-guide/rotation.md" },
    { "Audit log" = "user-guide/audit-log.md" },
  ] },
  { "Integrations" = [
    { "GitHub Actions" = "integrations/github-actions.md" },
    { "Kubernetes" = "integrations/kubernetes.md" },
    { "Ansible" = "integrations/ansible.md" },
    { "Shells and AI agents" = "integrations/shells-and-agents.md" },
  ] },
  { "CLI reference" = "cli.md" },
  { "Security model" = "security.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "Geist"
code = "Geist Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.toc]
permalink = true
